# Runs Kafka and Elasticsearch on your machine for local development. See README.md for how to
# start them. Both listen on 127.0.0.1 only, so nothing outside
# this machine can reach them.
name: analytics-pipeline

services:
  # One Kafka server. Kafka 4 coordinates itself (no separate Zookeeper), so this one process is
  # both the "broker" (stores messages) and the "controller" (keeps track of topics).
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Port 9092 is for programs (the API, the worker, kafka-topics.sh); 9093 is Kafka's own
      # bookkeeping. Kafka tells programs to reach it at 127.0.0.1:9092, which works from your
      # machine and from inside this container.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics come only from config/local.yml (`pnpm topics`), so a misspelled topic name fails.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # Kafka's internal topics default to 3 copies, which needs 3 servers. We have one.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD',
          '/opt/kafka/bin/kafka-broker-api-versions.sh',
          '--bootstrap-server',
          '127.0.0.1:9092',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # One Elasticsearch server, with logins and HTTPS turned off. Fine on your laptop, never anywhere
  # else.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    ports:
      - '127.0.0.1:9200:9200'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      # Machine-learning features aren't used and take extra memory.
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

# Named storage, so data survives `docker compose down`. `docker compose down -v` deletes it.
volumes:
  kafka-data:
  es-data:

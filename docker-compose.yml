# Local stack: Kafka (KRaft, single node) and Elasticsearch (single node), plus a one-shot topic
# init. Services are added in later phases. Everything binds to 127.0.0.1 only.
name: observability

services:
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    hostname: kafka
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # In-network clients use kafka:29092; the host uses 127.0.0.1:9092 (not `localhost`, which
      # may resolve to ::1 first while the port is bound on IPv4 only).
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics come only from infra/kafka/topics.conf; a typo must fail, not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD',
          '/opt/kafka/bin/kafka-broker-api-versions.sh',
          '--bootstrap-server',
          'localhost:29092',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['sh', '/infra/kafka/create-topics.sh']
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./infra/kafka:/infra/kafka:ro
    restart: 'no'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    ports:
      - '127.0.0.1:9200:9200'
    environment:
      discovery.type: single-node
      cluster.name: observability-local
      # Local only: no TLS or auth (documented in README). Production enables xpack security.
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  kafka-data:
  es-data:

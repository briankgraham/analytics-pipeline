# Settings for running on your own machine with `docker compose` (see README.md). This is the only
# environment in use so far.
#
# topics: every Kafka topic this project uses. `pnpm topics` reads this list, creates any topic that
# is missing, and applies each topic's retentionDays, even to topics that already exist. Kafka is set to never create topics on its own, so a topic that isn't listed
# here doesn't exist, and a misspelled topic name fails instead of quietly making a new topic.
# Each topic has:
#   name        what the code uses to read and write it
#   partitions  how many parallel lanes the topic is split into; more lanes let more workers read
#               at once. It can't be changed in place; to change it locally, wipe the data with
#               `docker compose down -v` and start again.
#   purpose     what the topic is for, in a sentence
#   retentionDays  how long Kafka keeps a message before deleting it, read or not.

# kafka.brokers: the addresses programs use to find Kafka (the same one docker-compose.yml publishes).
# api.port:      the port the API listens on, on this machine only.
# api.topic:     the topic the API puts accepted logs into. It must be listed under topics.
#
# elasticsearch.url:      where Elasticsearch answers (the address docker-compose.yml publishes).
# elasticsearch.index:    the index (Elasticsearch's word for a table) the worker saves logs into and
#                         the API searches. The worker creates it on start if it's missing.
# elasticsearch.replicas: how many extra copies of the index Elasticsearch keeps, on other servers.
#                         Locally there's only one server, so 0; a copy would have nowhere to go.
# elasticsearch.bulkSize: the most logs sent to Elasticsearch in one request, at least 2. The worker
#                         sends what's available without waiting to fill a request.
# elasticsearch.requestTimeoutMs: how long one call to Elasticsearch may take before it counts as failed.
# elasticsearch.retries:  what to do when Elasticsearch is too busy, can't be reached, or refuses a
#                         log for any reason:
#   maxRetries            how many extra tries after the first one.
#   delayMs               how long to wait before the first retry, in milliseconds.
#   exponential           true doubles the wait after each retry; false keeps it the same.
#   jitter                true picks each wait at random, from 0 up to the wait above, so several
#                         workers don't all come back at the same moment.
#                         The longest wait plus requestTimeoutMs can be at most 27 seconds, because
#                         Kafka drops a worker that's silent for 30. maxRetries can be at most 20. If
#                         the retries run out while saving logs, the log goes to the failed topic if
#                         other logs in its request saved; if none did, the worker waits (see
#                         worker.waitBeforeTryingAgainMs). If they run out while creating the
#                         index or checking its fields, the worker stops.
# worker.topic:           the topic the worker reads logs from. It must be listed under topics.
# worker.failedTopic:     where good logs go when they can't be saved, as the next two settings say.
# worker.group:           the name the worker reads under. Kafka remembers how far each group has
#                         read, so a restarted worker carries on where it stopped.
# worker.waitBeforeTryingAgainMs: how long to wait when the retries run out and none of the logs in a
#                         request saved, which looks like Elasticsearch being down. The logs wait
#                         safely in Kafka, and the worker reads them again, with any newer ones. A
#                         partition is never paused. Keep it short: while the worker waits, Kafka
#                         can't hand it new logs from any of its partitions.
# worker.moveToFailedAfterDays:   move a log that still can't be saved to the failed topic once it's
#                         this old. It must be less than the logs topic's retentionDays.
# worker.alertAfterMs:    print an alert at each wait once a partition has been stuck this long.

kafka:
  brokers:
    - 127.0.0.1:9092

api:
  port: 3000
  topic: logs

elasticsearch:
  url: http://127.0.0.1:9200
  index: logs
  replicas: 0
  bulkSize: 500
  requestTimeoutMs: 10000
  retries:
    maxRetries: 5
    delayMs: 500
    exponential: true
    jitter: true

worker:
  topic: logs
  failedTopic: failed
  group: worker
  waitBeforeTryingAgainMs: 5000
  moveToFailedAfterDays: 6
  alertAfterMs: 600000

topics:
  - name: logs
    partitions: 3
    purpose: Logs the API has accepted, waiting for the worker to save them to Elasticsearch.
    retentionDays: 7
  - name: failed
    partitions: 3
    purpose: Good logs the worker could not save, kept safe for longer than in the logs topic.
    retentionDays: 30

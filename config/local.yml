# Settings for running on your own machine with `docker compose` (see README.md). This is the only
# environment in use so far.
#
# topics: every Kafka topic this project uses. `pnpm topics` reads this list and creates any topic
# that is missing. Kafka is set to never create topics on its own, so a topic that isn't listed
# here doesn't exist, and a misspelled topic name fails instead of quietly making a new topic.
# Each topic has:
#   name        what the code uses to read and write it
#   partitions  how many parallel lanes the topic is split into; more lanes let more workers read
#               at once. It can't be changed in place; to change it locally, wipe the data with
#               `docker compose down -v` and start again.
#   purpose     what the topic is for, in a sentence

# kafka.brokers: the addresses programs use to find Kafka (the same one docker-compose.yml publishes).
# api.port:      the port the API listens on, on this machine only.
# api.topic:     the topic the API puts accepted logs into. It must be listed under topics.
#
# elasticsearch.url:      where Elasticsearch answers (the address docker-compose.yml publishes).
# elasticsearch.index:    the index (Elasticsearch's word for a table) the worker saves logs into.
#                         The worker creates it on start if it's missing.
# elasticsearch.replicas: how many extra copies of the index Elasticsearch keeps, on other servers.
#                         Locally there's only one server, so 0; a copy would have nowhere to go.
# elasticsearch.retries:  what to do when Elasticsearch answers 429 ("too many requests"):
#   maxRetries            how many extra tries after the first one.
#   delayMs               how long to wait before the first retry, in milliseconds.
#   exponential           true doubles the wait after each retry; false keeps it the same.
#   jitter                true picks each wait at random, from 0 up to the wait above, so several
#                         workers don't all come back at the same moment.
#                         These settings wait 500 + 1000 + 2000 + 4000 + 8000 ms = 15.5 seconds at
#                         most. The limit is 16 seconds, because Kafka drops a worker that's silent
#                         for 30. If the retries run out while saving a log, the worker tries that
#                         log again. If they run out while creating the index, the worker stops.
# worker.topic:           the topic the worker reads logs from. It must be listed under topics.
# worker.group:           the name the worker reads under. Kafka remembers how far each group has
#                         read, so a restarted worker carries on where it stopped.

kafka:
  brokers:
    - 127.0.0.1:9092

api:
  port: 3000
  topic: logs

elasticsearch:
  url: http://127.0.0.1:9200
  index: logs
  replicas: 0
  retries:
    maxRetries: 5
    delayMs: 500
    exponential: true
    jitter: true

worker:
  topic: logs
  group: worker

topics:
  - name: logs
    partitions: 3
    purpose: Logs the API has accepted, waiting for the worker to save them to Elasticsearch.

# Kafka topics for the local stack (docs/design.md, Topic settings). One topic per line:
#   <name> <partitions> <config>=<value> ...
# List values use commas (cleanup.policy=compact,delete). Read by infra/kafka/create-topics.sh and
# scripts/compose-smoke.sh; tools/arch-rules checks it against the code's topic names and the design.
#
# These are the topics' complete dynamic configs: create-topics.sh deletes any override not listed.
# segment.ms sits below retention.ms on purpose: Kafka only deletes or compacts closed segments, so
# with the 7-day default segment the 1 h / 6 h retention (and compaction) would never take effect.
#
# events.raw, aggregates, and events.rejected share a partition count: the aggregator writes to the
# same partition number as the input partition, so these three must stay aligned. Partition counts
# are never changed in place (that remaps keys); change them with `docker compose down -v`.
events.raw       12  cleanup.policy=delete          retention.ms=3600000    segment.ms=600000
aggregates       12  cleanup.policy=compact,delete  retention.ms=21600000   segment.ms=3600000   max.compaction.lag.ms=3600000
events.rejected  12  cleanup.policy=delete          retention.ms=604800000  segment.ms=86400000
events.late      1   cleanup.policy=delete          retention.ms=604800000  segment.ms=86400000
events.dlq       1   cleanup.policy=delete          retention.ms=604800000  segment.ms=86400000
alerts           1   cleanup.policy=delete          retention.ms=604800000  segment.ms=86400000
